name: Deploy to Zeabur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify Plugin Structure
        run: |
          ls -la plugins/nodebb-plugin-sub2api-sso/
          test -f plugins/nodebb-plugin-sub2api-sso/plugin.json
          test -f plugins/nodebb-plugin-sub2api-sso/library.js
      
      - name: Notify Deploy
        run: |
          echo "✅ 代码已推送到 main 分支"
          echo "🔄 Zeabur 将自动触发部署（如果已配置 GitHub 集成）"
          echo ""
          echo "📋 部署后检查清单："
          echo "  1. Zeabur 控制台 → NodeBB 服务 → Logs"
          echo "  2. 验证环境变量已配置（11 个）"
          echo "  3. 访问 https://community.jisudeng.com"
          echo "  4. 验证 SSO 流程"

      - name: Slack Notification
        if: always()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"NodeBB 插件代码已更新: ${{ github.event.head_commit.message }}\"}" || true
